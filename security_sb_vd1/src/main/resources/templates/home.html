<!DOCTYPE html>

<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Trang chủ - UTEShop</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">

</head>


<body class="bg-light">


<!-- Header -->

<div th:replace="~{fragments/header :: header}">
</div>


<!-- Main -->

<main class="container py-5">


    <!-- Welcome -->

    <div class="row justify-content-center">

        <div class="col-lg-8">


            <div class="card border-0 shadow-sm">

                <div class="card-body text-center p-5">


                    <i class="bi bi-person-circle display-1 text-primary">
                    </i>


                    <h1 class="mt-3">

                        Xin chào,

                        <span
                            th:text="${#authentication.principal.fullName}">
                            Nguyễn Văn A
                        </span>

                    </h1>


                    <p class="lead text-muted">

                        Chào mừng bạn đến với UTEShop.

                    </p>


                    <!-- User information -->

                    <div class="row mt-4 text-start">


                        <div class="col-md-6 mb-3">

                            <div class="card bg-light border-0">

                                <div class="card-body">

                                    <small class="text-muted">
                                        Username
                                    </small>

                                    <h5
                                        th:text="${#authentication.principal.username}">

                                        user01

                                    </h5>

                                </div>

                            </div>

                        </div>


                        <div class="col-md-6 mb-3">

                            <div class="card bg-light border-0">

                                <div class="card-body">

                                    <small class="text-muted">
                                        Email
                                    </small>

                                    <h5
                                        th:text="${#authentication.principal.email}">

                                        user01@gmail.com

                                    </h5>

                                </div>

                            </div>

                        </div>


                        <div class="col-md-6 mb-3">

                            <div class="card bg-light border-0">

                                <div class="card-body">

                                    <small class="text-muted">
                                        Họ và tên
                                    </small>

                                    <h5
                                        th:text="${#authentication.principal.fullName}">

                                        Nguyễn Văn A

                                    </h5>

                                </div>

                            </div>

                        </div>


                        <div class="col-md-6 mb-3">

                            <div class="card bg-light border-0">

                                <div class="card-body">

                                    <small class="text-muted">
                                        Quyền
                                    </small>

                                    <h5>

                                        <span
                                            class="badge bg-primary"
                                            th:text="${#authentication.principal.role}">

                                            ROLE_USER

                                        </span>

                                    </h5>

                                </div>

                            </div>

                        </div>


                    </div>


                    <!-- Logout -->

                    <form th:action="@{/logout}"
                          method="post"
                          class="mt-3">

                        <button
                            type="submit"
                            class="btn btn-outline-danger">

                            <i class="bi bi-box-arrow-right"></i>

                            Đăng xuất

                        </button>

                    </form>


                </div>

            </div>


        </div>

    </div>


</main>


<!-- Footer -->

<footer class="bg-dark text-white text-center py-3">

    <div class="container">

        <small>

            © 2026 UTEShop -
            Spring Boot Security

        </small>

    </div>

</footer>


<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
