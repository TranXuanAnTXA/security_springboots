<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

<nav th:fragment="header"
     class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">

    <div class="container">

        <!-- Logo -->
        <a class="navbar-brand fw-bold"
           th:href="@{/}">

            <i class="bi bi-shop"></i>
            UTEShop

        </a>


        <!-- Mobile button -->
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar">

            <span class="navbar-toggler-icon"></span>

        </button>


        <div class="collapse navbar-collapse"
             id="mainNavbar">

            <!-- Menu -->
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <li class="nav-item">

                    <a class="nav-link active"
                       th:href="@{/}">

                        <i class="bi bi-house"></i>
                        Trang chủ

                    </a>

                </li>

            </ul>


            <!-- Chưa đăng nhập -->
            <div sec:authorize="!isAuthenticated()">

                <a class="btn btn-outline-light"
                   th:href="@{/login}">

                    <i class="bi bi-box-arrow-in-right"></i>
                    Đăng nhập

                </a>

            </div>


            <!-- Đã đăng nhập -->
            <div sec:authorize="isAuthenticated()"
                 class="dropdown">

                <button class="btn btn-dark dropdown-toggle d-flex align-items-center"
                        type="button"
                        data-bs-toggle="dropdown">

                    <!-- Avatar -->
                    <img
                        th:src="${#authentication.principal.images != null
                            and !#strings.isEmpty(#authentication.principal.images)
                            ? #authentication.principal.images
                            : '/images/user.png'}"
                        alt="Avatar"
                        width="40"
                        height="40"
                        class="rounded-circle me-2"
                        style="object-fit: cover;">

                    <!-- Username -->
                    <span
                        th:text="${#authentication.principal.username}">
                        user01
                    </span>

                </button>


                <!-- Dropdown -->
                <ul class="dropdown-menu dropdown-menu-end">

                    <li>

                        <h6 class="dropdown-header">
                            Thông tin tài khoản
                        </h6>

                    </li>


                    <li>

                        <span class="dropdown-item-text">

                            <i class="bi bi-person"></i>

                            <strong
                                th:text="${#authentication.principal.fullName}">
                                Nguyễn Văn A
                            </strong>

                        </span>

                    </li>


                    <li>

                        <span class="dropdown-item-text">

                            <i class="bi bi-envelope"></i>

                            <span
                                th:text="${#authentication.principal.email}">
                                user01@gmail.com
                            </span>

                        </span>

                    </li>


                    <li>

                        <span class="dropdown-item-text">

                            <i class="bi bi-shield-check"></i>

                            <span
                                th:text="${#authentication.principal.role}">
                                ROLE_USER
                            </span>

                        </span>

                    </li>


                    <li>
                        <hr class="dropdown-divider">
                    </li>


                    <!-- Logout -->

                    <li>

                        <form th:action="@{/logout}"
                              method="post">

                            <button type="submit"
                                    class="dropdown-item text-danger">

                                <i class="bi bi-box-arrow-right"></i>

                                Đăng xuất

                            </button>

                        </form>

                    </li>

                </ul>

            </div>

        </div>

    </div>

</nav>

</body>
</html>
